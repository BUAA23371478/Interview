# 本地开发基础设施：Redis + MySQL（复现生产拓扑）
#
# 用途：让「本地跑通」与线上环境尽可能一致——SQLite/进程内实现掩盖的
# 并发、锁、连接池、事务隔离问题，只有在真实 MySQL/Redis 上才会暴露。
#
#   docker compose -f deploy/docker-compose.infra.yml up -d
#   docker compose -f deploy/docker-compose.infra.yml ps
#   docker compose -f deploy/docker-compose.infra.yml down -v
#
# 端口刻意避开本机可能已占用的默认端口，减少冲突。
services:
  redis:
    image: redis:7-alpine
    container_name: iam-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: iam-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --slow-query-log=1
      --long-query-time=1
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd_local
      MYSQL_DATABASE: interview_agent
      MYSQL_USER: interview_agent
      MYSQL_PASSWORD: interview_agent_pwd
    ports:
      - "3307:3306"
    volumes:
      - iam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pwd_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  iam_mysql_data:
